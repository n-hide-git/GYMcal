<script>

/* 2026.07.16 追加: 全角数字（０-９）が入力された場合、自動的に半角数字へ変換する
   （数値専用アプリのため、全角モードで打ってしまっても実害が出ないようにする） */
function toHalfWidth(str){

    return str.replace(/[０-９]/g, s=>
        String.fromCharCode(s.charCodeAt(0) - 0xFEE0)
    );
}

/* 2026.07.16 追加: マイナス入力を禁止し、入れようとした場合は "00" にリセットする
   "-"が値のどこかに含まれる場合（例: 7-333 のような不正な形も含む）はすべて対象 */
function guardNegative(el){

    if(el.value !== '' && (el.value.includes('-') || Number(el.value) < 0)){
        el.value = '00';
    }
}

/* 2026.07.16 追加: マイナス禁止ガード付きで値を保存・再計算する（分・整数欄用） */
function guardAndSave(el){

    guardNegative(el);
    saveAndCalc();
}

/* 2026.07.16 追加: ％（baseP_int + baseP_dec）が100.0未満にならないようにする
   100未満になった場合は100.0％にリセットする */
function checkPercentMin(){

    const intEl=document.getElementById('baseP_int');
    const decEl=document.getElementById('baseP_dec');

    const val=parseFloat(
        (intEl.value||0) + "." + (decEl.value||0)
    );

    if(val < 100){
        intEl.value='100';
        decEl.value='00';
        saveAndCalc();
    }
}

/* 2026.07.16 追加: 分欄は1桁縛り。2桁目以降を入力しようとした場合は
   切り詰めではなく "0" にリセットする（欄を指定したら中身の数字は0にする）
   ※ フォーカス時のクリアは各inputのonfocus="this.value=''"で対応 */
function limitMinute(el){

    el.value = toHalfWidth(el.value);
    guardNegative(el);

    if(el.value.length > 1){
        el.value = '0';
    }

    saveAndCalc();
}

function limit(el,max){

    el.value = toHalfWidth(el.value);
    guardNegative(el);

    if(el.value.length > max){
        el.value = el.value.slice(0,max);
    }

    // 秒は59まで
    if(
        (el.id === 'topS' || el.id === 'myS') &&
        Number(el.value) > 59
    ){
        el.value = 59;
    }

    // ミリ秒は999まで
    if(
        (el.id === 'topMs' || el.id === 'myMs') &&
        Number(el.value) > 999
    ){
        el.value = 999;
    }

    saveAndCalc();
}

/* 2026.07.16 追加: フォーカスが外れた時点で桁数固定の0埋め表示に確定する
   例）2桁欄に "2" だけ入力→blur → "02" と表示され、20ではなく2として
   確定したことが見た目で分かるようになる
   ※ ％欄（baseP_int / baseP_dec）専用。未入力の場合は何もしない（空のまま） */
function padOnBlur(el, length){

    if(el.value !== ''){
        el.value = el.value.padStart(length, '0');
        saveAndCalc();
    }
}

/* 2026.07.21 追加: ％欄以外（TOPタイム・自分のタイムの分/秒/ミリ秒）専用の0埋め処理。
   カーソルが離れた時点で未入力の場合は桁数分の"0"（3桁なら"000"）を自動入力する。
   値が入っている場合は従来通り桁数分のpaddingのみ行う */
function padOnBlurZero(el, length){

    if(el.value !== ''){
        el.value = el.value.padStart(length, '0');
    }else{
        el.value = '0'.padStart(length, '0');
    }

    saveAndCalc();
}

/* 2026.07.16 追加: 「入力済」ボタン用。フォーカスを外してキーボードを閉じ、
   最新の値で保存・再計算する（最後の欄にEnter移動先が無い代わりの操作） */
function finishInput(){

    if(document.activeElement && document.activeElement.tagName==='INPUT'){
        document.activeElement.blur();
    }

    saveAndCalc();
}

/* 2026.11.13 変更：従来の保存キーをそのまま利用し、既存データとの互換性を維持 */
function saveAndCalc(){
    if(document.getElementById('topTimeInput')) syncCombinedToLegacy();
    const ids=['topM','topS','topMs','baseP_int','baseP_dec','myM','myS','myMs'];
    ids.forEach(id=>localStorage.setItem(id,document.getElementById(id).value));
    calculate();
}

/* 2026.11.13 変更：Enterキーで統合入力欄の次へ移動 */
const fieldOrder=['topTimeInput','basePercentInput','myTimeInput'];

function focusNext(currentId){
    const idx=fieldOrder.indexOf(currentId);
    const nextId=fieldOrder[idx+1];
    if(nextId) document.getElementById(nextId).focus();
    else document.getElementById(currentId).blur();
}

/* 2026.11.13 追加：統合入力欄の整形・旧保存データ変換
   既存の topM 等のlocalStorageキーは変更せず、従来の計算関数 calculate() を利用する。 */
function digitsOnly(value){
    return toHalfWidth(String(value || '')).replace(/[^0-9]/g,'');
}

/* 2026.11.13 修正：タイムは「/」をユーザーが入力。各区分の桁数を制限する */
function formatTimeDigits(raw){
    const parts=toHalfWidth(String(raw || '')).replace(/[^0-9/]/g,'').split('/').slice(0,3);
    if(parts.length>0) parts[0]=parts[0].slice(0,3); // 分
    if(parts.length>1) parts[1]=parts[1].slice(0,2); // 秒
    // 2026.11.13 追加：秒は59まで。60以上になる2桁目は入力できない（例：1/80 → 1/8）
    if(parts.length>1 && parts[1].length===2 && Number(parts[1])>59) parts[1]=parts[1].slice(0,1);
    if(parts.length>2) parts[2]=parts[2].slice(0,3); // ミリ秒：最大3桁
    return parts.join('/');
}

/* 2026.11.13 修正：％は整数3桁入力後、4桁目から小数点「.」を表示する */
/* 2026.11.13 変更：「/」（または「.」）を区切りとして入力可能にし、100/00 → 100.00 と表示する。
   区切りを打たない場合は、従来どおり4桁目から自動で「.」を入れる。 */
function formatPercentDigits(raw){
    const s=toHalfWidth(String(raw || '')).replace(/[^0-9/.]/g,'');
    const m=s.search(/[/.]/);
    if(m>=0){
        const intPart=s.slice(0,m).replace(/[^0-9]/g,'').slice(0,3);
        const decPart=s.slice(m+1).replace(/[^0-9]/g,'').slice(0,2);
        return intPart+'.'+decPart;
    }
    const d=s.slice(0,5);
    return d.length>3 ? d.slice(0,3)+'.'+d.slice(3,5) : d;
}

/* 2026.11.13 修正：入力中は「/」、入力欄から離れた後は「分・秒」表記に切り替える */
function timeInputToJapanese(raw){
    const parts=String(raw || '').split('/');
    if(parts.length!==3 || parts.some(part=>part==='')) return raw;
    const minute=Number(parts[0]);
    const second=Number(parts[1]);
    const milliText=String(parts[2]).padEnd(3,'0');
    const milli=Number(milliText);
    if(!Number.isFinite(minute) || !Number.isFinite(second) || !Number.isFinite(milli) || second>59) return raw;
    return `${minute}分${String(second).padStart(2,'0')}秒${String(milli).padStart(3,'0')}`;
}

function japaneseToTimeInput(raw){
    const match=String(raw || '').match(/^(\\d+)分(\\d+)秒(\\d{1,3})$/);
    if(!match) return raw;
    return `${match[1]}/${match[2]}/${match[3]}`;
}

/* 2026.11.13 修正：入力欄以外のタイム表示は「分・秒・ミリ秒」表記。入力時のみ「/」を使用 */
function updateTimeInterpretation(inputId, outputId){
    const raw=document.getElementById(inputId).value;
    const parts=raw.split('/');
    const output=document.getElementById(outputId);
    if(parts.length!==3 || parts.some(part=>part==='')){
        output.textContent='解釈：分・秒・ミリ秒を「/」で入力';
        return;
    }
    const minute=Number(parts[0]);
    const second=Number(parts[1]);
    const milli=Number(parts[2].padEnd(3,'0'));
    if(second>59){
        output.textContent='解釈：秒は59以下で入力してください';
        return;
    }
    output.textContent=`${minute}分${String(second).padStart(2,'0')}秒${String(milli).padStart(3,'0')}`;
}

function setLegacyTime(prefix, formatted){
    // 「分/秒/ミリ秒」の3区分を、区分ごとに数値として読み取る
    const parts=String(formatted || '').split('/');
    const minute=digitsOnly(parts[0] || '').slice(0,3);
    const second=digitsOnly(parts[1] || '').slice(0,2);
    const milli=digitsOnly(parts[2] || '').slice(0,3);
    // 秒は従来仕様どおり59秒を上限とする
    const safeSec=(second && Number(second)>59) ? '59' : second;
    // ミリ秒は入力桁を右側0埋め（33 → 330）
    const safeMs=milli ? milli.padEnd(3,'0') : '';
    document.getElementById(prefix+'M').value=minute;
    document.getElementById(prefix+'S').value=safeSec;
    document.getElementById(prefix+'Ms').value=safeMs;
}

// 2026.11.13 修正：％表示は「100.00」。旧形式「100/00」も読み取り可能にする
function setLegacyPercent(formatted){
    const parts=String(formatted || '').split(/[./]/);
    const integer=digitsOnly(parts[0]).slice(0,6);
    const decimal=digitsOnly(parts[1] || '').slice(0,2);
    document.getElementById('baseP_int').value=integer;
    document.getElementById('baseP_dec').value=decimal;
}

function syncCombinedToLegacy(){
    setLegacyTime('top',document.getElementById('topTimeInput').value);
    setLegacyPercent(document.getElementById('basePercentInput').value);
    setLegacyTime('my',document.getElementById('myTimeInput').value);
    updateTimeInterpretation('topTimeInput','topTimeInterpretation');
    updateTimeInterpretation('myTimeInput','myTimeInterpretation');
}

/* 2026.11.13 追加：入力途中でも旧形式へ反映し、従来処理で即時計算・保存 */
function onCombinedInput(el, kind){
    const oldValue=el.value;
    const pos=el.selectionStart || oldValue.length;
    const digitsBefore=digitsOnly(oldValue.slice(0,pos)).length;
    const formatted=(kind==='percent') ? formatPercentDigits(oldValue) : formatTimeDigits(oldValue);
    el.value=formatted;
    // ％欄は自動挿入した「/」の後ろへカーソルを移動。
    // タイム欄はユーザーが「/」を入力するため、通常はカーソル位置を変更しない。
    if(kind==='percent' || formatted!==oldValue){
        let newPos=0, count=0;
        if(digitsBefore>0){
            for(let i=0;i<el.value.length;i++){
                if(/[0-9]/.test(el.value[i])) count++;
                newPos=i+1;
                if(count===digitsBefore) break;
            }
        }
        // 2026.11.13 追加：％欄で末尾に入力した場合は、自動で入る「.」の後ろ（末尾）へカーソルを置く
        if(kind==='percent' && pos>=oldValue.length) newPos=el.value.length;
        try{ el.setSelectionRange(newPos,newPos); }catch(e){}
    }
    syncCombinedToLegacy();
    saveAndCalc();
}

/* 2026.11.13 修正：％は小数1桁を右側0埋め。100％未満は100.00へ補正 */
function finalizeCombinedPercent(){
    const el=document.getElementById('basePercentInput');
    /* 2026.11.13 変更：表示中の「.」位置で整数部・小数部を分ける（100/05 や 10/55 を正しく判定するため） */
    const parts=el.value.split('.');
    const integer=digitsOnly(parts[0]).slice(0,3);
    let decimal=digitsOnly(parts[1] || '').slice(0,2);
    if(!integer && !decimal){ el.value=''; syncCombinedToLegacy(); saveAndCalc(); return; }
    const intValue=parseInt(integer || '0',10);
    if(integer.length<3 || intValue<100){
        el.value='100.00';
    }else{
        decimal=decimal.padEnd(2,'0');
        el.value=integer+'.'+decimal;
    }
    syncCombinedToLegacy();
    saveAndCalc();
}

/* 2026.11.13 追加：旧localStorageデータを統合欄へ読み替える */
function loadCombinedInputs(){
    const get=id=>localStorage.getItem(id) || '';
    // 旧データは分1桁・秒2桁・ミリ秒3桁で保存されていたため、各要素を個別に桁合わせ
    const top=[get('topM').padStart(2,'0'),get('topS').padStart(2,'0'),get('topMs').padStart(3,'0')].join('');
    const mine=[get('myM').padStart(2,'0'),get('myS').padStart(2,'0'),get('myMs').padStart(3,'0')].join('');
    const pInt=get('baseP_int'), pDec=get('baseP_dec');
    document.getElementById('topTimeInput').value=(get('topM') || get('topS') || get('topMs')) ? [get('topM').padStart(2,'0'),get('topS').padStart(2,'0'),get('topMs').padStart(3,'0')].join('/') : '';
    document.getElementById('myTimeInput').value=(get('myM') || get('myS') || get('myMs')) ? [get('myM').padStart(2,'0'),get('myS').padStart(2,'0'),get('myMs').padStart(3,'0')].join('/') : '';
    document.getElementById('basePercentInput').value=pInt ? (pInt+'.'+String(pDec || '0').padEnd(2,'0')) : '';
    syncCombinedToLegacy();
    calculate();
    // 初期表示は日本語形式。編集のためにフォーカスすると「/」形式へ戻す
    document.getElementById('topTimeInput').value=timeInputToJapanese(document.getElementById('topTimeInput').value);
    document.getElementById('myTimeInput').value=timeInputToJapanese(document.getElementById('myTimeInput').value);
}

/* 2026.11.13 変更：統合欄をタップしたら全選択、Enterで次の欄へ移動 */
fieldOrder.forEach((id,index)=>{
    const el=document.getElementById(id);
    el.addEventListener('focus',()=>{
        if(id!=='basePercentInput') el.value=japaneseToTimeInput(el.value);
        setTimeout(()=>el.select(),0);
    });
    el.addEventListener('click',()=>setTimeout(()=>el.select(),0));
    el.addEventListener('input',()=>onCombinedInput(el,id==='basePercentInput'?'percent':'time'));
    el.addEventListener('blur',()=>{
        if(id==='basePercentInput') finalizeCombinedPercent();
        else if(el.value){
            syncCombinedToLegacy(); saveAndCalc();
            el.value=timeInputToJapanese(el.value);
        }
    });
    el.addEventListener('keydown',e=>{
        if(e.isComposing || e.keyCode===229) return;
        if(e.key==='Enter'){
            e.preventDefault();
            focusNext(id);
        }
    });
});

/* ===== 2026.11.13 追加：スマホ用 独自キーパッド =====
   標準キーボードに「/」が無い問題への対策。
   入力欄は inputmode="none" で標準キーボードを出さず、画面下のキーパッドから入力する。
   キー入力後は 'input' イベントを発火し、既存の onCombinedInput() → 計算・保存の流れをそのまま利用する。 */
const keypadEl=document.getElementById('keypad');
let keypadField=null;

function keypadShow(el){
    keypadField=el;
    keypadEl.classList.add('open');
    document.body.classList.add('kp-open');
    // 2026.11.13 変更：％欄でも「/」を使うため、無効化は廃止
    setTimeout(()=>{ try{ el.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} },50);
}

function keypadHide(){
    keypadEl.classList.remove('open');
    document.body.classList.remove('kp-open');
    keypadField=null;
}

function keypadInsert(ch){
    const el=keypadField;
    if(!el) return;
    // 選択中（フォーカス直後は全選択）なら置き換え、そうでなければカーソル位置に挿入
    el.setRangeText(ch, el.selectionStart, el.selectionEnd, 'end');
    el.dispatchEvent(new Event('input',{bubbles:true}));
}

function keypadBackspace(){
    const el=keypadField;
    if(!el) return;
    let s=el.selectionStart;
    const e=el.selectionEnd;
    if(s===e){
        if(s===0) return;
        s--;
        // ％欄の自動「.」は一緒に消して、その前の数字まで削除する
        if(el.id==='basePercentInput' && el.value[s]==='.' && s>0) s--;
    }
    el.setRangeText('', s, e, 'end');
    el.dispatchEvent(new Event('input',{bubbles:true}));
}

function keypadNext(){
    if(keypadField) focusNext(keypadField.id);
}

function keypadClose(){
    finishInput();
    keypadHide();
}

fieldOrder.forEach(id=>{
    const el=document.getElementById(id);
    el.addEventListener('focus',()=>keypadShow(el));
    // 入力欄以外へフォーカスが移った場合のみキーパッドを閉じる
    el.addEventListener('blur',()=>setTimeout(()=>{
        const a=document.activeElement;
        if(!(a && fieldOrder.includes(a.id))) keypadHide();
    },100));
});

// キーパッドをタップしても入力欄のフォーカスが外れないようにする
keypadEl.addEventListener('mousedown',e=>e.preventDefault());

keypadEl.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b || b.disabled) return;
    const k=b.dataset.key;
    if(k==='back') keypadBackspace();
    else if(k==='next') keypadNext();
    else if(k==='close') keypadClose();
    else keypadInsert(k);
});

window.onload=()=>{
    loadCombinedInputs();
};

/* 2026.11.13 修正：統合入力欄の値を直接ミリ秒へ変換する
   入力中の「分/秒/ミリ秒」と、フォーカスを外した後の「分・秒・ミリ秒」の両方に対応 */
function combinedTimeToMs(inputId, prefix){
    const raw=String(document.getElementById(inputId).value || '').trim();
    let match=raw.match(/^(\d+)\/(\d{1,2})\/(\d{1,3})$/);
    if(!match) match=raw.match(/^(\d+)分(\d{1,2})秒(\d{1,3})$/);
    if(match){
        const minute=Number(match[1]);
        const second=Number(match[2]);
        const milli=Number(String(match[3]).padEnd(3,'0'));
        if(second>59) return 0;
        return minute*60000+second*1000+milli;
    }
    // 旧保存データとの互換用。統合欄が未入力の場合のみ旧欄を参照
    return Number(document.getElementById(prefix+'M').value||0)*60000+
           Number(document.getElementById(prefix+'S').value||0)*1000+
           Number(document.getElementById(prefix+'Ms').value||0);
}

function calculate(){

    const topMs=combinedTimeToMs('topTimeInput','top');
    const myMs=combinedTimeToMs('myTimeInput','my');

    const basePInt=Number(document.getElementById('baseP_int').value||0);
    const basePDec=String(document.getElementById('baseP_dec').value||'0').padEnd(2,'0').slice(0,2);
    const baseP=basePInt+Number(basePDec)/100;

    const tbody=document.getElementById('tableBody');
    const onePercentEl=document.getElementById('onePercent');

    tbody.innerHTML='';

    if(topMs===0 || baseP===0){

        document.getElementById('result').innerText=
            'あなたの％: ---';

        onePercentEl.innerText='';

        return;
    }

    // 2026.11.13 修正：TOP％補正を先に行い、100％相当タイムを求める。
    // 例：TOP 62.300秒が100.30％の場合
    // 62.300 ÷ 1.003 ＝ 62.113659...秒（これが100％基準タイム）
    // 100.3％の補正を忘れると、1％表示もあなたの％も誤った値になる。
    const virtual100Ms = topMs / (baseP / 100);

    // 1％あたりの時間は、補正後の100％基準タイムを100で割る。
    // 内部計算では丸めず、表示時だけ小数第2位に四捨五入する。
    const onePercentSec = virtual100Ms / 100 / 1000;
    onePercentEl.innerText = `1％ ＝ ${onePercentSec.toFixed(2)}秒`;

    const rates=[
        100,
        105,
        107,
        110,
        115,
        120,
        125,
        130
    ];

    rates.forEach(r=>{

        const ms=
            virtual100Ms*(r/100);

        const m=
            Math.floor(ms/60000);

        const s=
            Math.floor((ms%60000)/1000);

        const mil=
            Math.floor(ms%1000);

        tbody.innerHTML+=`
        <tr>
            <td>${r}％</td>
            <td>
                ${m}分${s.toString().padStart(2,'0')}秒${mil.toString().padStart(3,'0')}
            </td>
        </tr>`;
    });

    const resultEl=document.getElementById('result');

    if(myMs>0){

        // 2026.11.13 修正：自分のタイムも補正後の100％基準タイムと比較する。
        // 途中の秒数・1％表示値では丸めず、最後の表示時だけ小数第2位にする。
        // 例：83.555秒 ÷ 62.113659...秒 × 100 ＝ 134.52％
        const myPercent = ((myMs / virtual100Ms) * 100).toFixed(2);

        resultEl.innerText=
            `あなたの％: ${myPercent}％`;

        /* 2026.07.30 追加: 100％未満でオレンジ背景 */
        if(myPercent < 100){
            resultEl.classList.add('under-100');
        }else{
            resultEl.classList.remove('under-100');
        }

    }else{

        resultEl.innerText=
            'あなたの％: ---';
        resultEl.classList.remove('under-100');
    }
}

</script>
