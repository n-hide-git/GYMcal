<html lang="ja">
<head>
<meta charset="UTF-8">
<title>良く見える！モトジムTOP比</title>
<meta name="viewport" content="width=device-width, initial-scale=0.8">

<style>
/* 2026.07.21 変更: 余白を約半分に(padding 20px→10px) */
body {
    font-family: sans-serif;
    padding: 10px;
    max-width: 500px;
    margin: auto;
}

h3 {
    text-align: center;
    font-size: 1.6em;
    color: #004a99;
    /* 2026.07.21 変更: 余白を約半分に(20px→10px) */
    margin-bottom: 10px;
    white-space: nowrap;
}

    
/* 2026.07.21 追加: h3の1行目(サブタイトル部分)を2行目より小さく表示 */
.sub-title {
    font-size: 0.6em;
    color: #666;
    font-weight: normal;
}

label {
    font-size: 1.3em;
    display: block;
    /* 2026.07.21 変更: 余白を約半分に(18px→9px, 8px→4px) */
    margin-top: 9px;
    margin-bottom: 4px;
    font-weight: bold;
}

.row-3 {
    display: flex;
    gap: 8px;
    /* 2026.07.21 変更: 余白を約半分に(15px→8px) */
    margin-bottom: 8px;
}

.row-3 > div {
    flex: 1;
    position: relative;
}

.row-2 {
    display: flex;
    gap: 8px;
    /* 2026.07.21 変更: 余白を約半分に(15px→8px) */
    margin-bottom: 8px;
}

.row-2 > div:nth-child(1) {
    flex: 3;
}

.row-2 > div:nth-child(2) {
    flex: 1;
    position: relative;
}

/* 2026.08.17 変更:
   TOPタイム・％設定・自分のタイムの数字を約30％拡大。
   数字を大きくした分、入力欄の上下余白を縮小して
   全体の上下サイズをできるだけコンパクトに維持する。 */
input {
    width: 100%;
    padding: 1px 5px;      /* 7px → 3px */
    box-sizing: border-box;
    text-align: center;
    border: 2px solid #888;
    border-radius: 6px;
    font-size: 3.50em;     /* 1.5em → 約30％拡大 */
    font-weight: bold;
}

/* 2026.07.16 追加: 打ち込み中（フォーカス中）の欄を薄い黄色にする */
input:focus {
    background: #fff9c4;
    outline: none;
    border-color: #d4b800;
}

/* 2026.07.16 追加: 0埋め対象の入力欄を右寄せにして桁の位置を視覚的に分かりやすくする */
.digit-guide input {
    text-align: right;
    padding-right: 10px;
}

.digit-guide::after {
    content: attr(data-placeholder);
    position: absolute;
    right: 8px;
    /* 2026.07.21 変更: input内padding縮小に伴いガイド文字の位置も調整(16px→10px) */
    top: 10px;
    color: #999;
    pointer-events: none;
    font-size: 0.75em;
}

/* 2026.07.16 追加: フォーカス中はガイド文字を隠す（入力の邪魔をしないため） */
.digit-guide:focus-within::after {
    display: none;
}

#result {
    /* 2026.07.21 変更: 余白を約半分に(20px→10px) */
    margin-top: 10px;
    padding: 10px;
    background: #004a99;
    color: white;
    border-radius: 8px;
    font-size: 2em;
    text-align: center;
    font-weight: bold;
    transition: background 0.3s;
}

/* 2026.07.30 追加: 100％未満の時オレンジ背景 */
#result.under-100 {
    background: #ff9800;
}

/* 2026.07.16 追加: 入力済ボタン */
#doneBtn {
    display: block;
    width: 100%;
    /* 2026.07.21 変更: 余白を約半分に(20px→10px, 14px→7px) */
    margin-top: 10px;
    padding: 7px;
    background: #888;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1.2em;
    font-weight: bold;
}

#doneBtn:active {
    background: #666;
}

#onePercent {
    /* 2026.07.21 変更: 余白を約半分に(10px→5px) */
    margin-top: 5px;
    text-align: center;
    font-size: 1.1em;
    font-weight: bold;
}

table {
    width: 100%;
    border-collapse: collapse;
    /* 2026.07.21 変更: 余白を約半分に(20px→10px) */
    margin-top: 10px;
}

th {
    background: #f0f0f0;
    font-size: 1.2em;
}

th, td {
    border: 1px solid #ccc;
    /* 2026.07.21 変更: 余白を約半分に(12px→6px) */
    padding: 6px;
    text-align: center;
    font-size: 1.15em;
}
   @media (max-width: 480px) {
    h3 {
        font-size: 1.4em;
    }
}    
</style>
</head>

<body>

<h3><span class="sub-title">2026.08.17 地道に更新中：nakaZ</span><br>「良く見える！モトジムTOP比」</h3>
    

<label>TOPタイム</label>
<div class="row-3">
    <div>
        <input type="number" inputmode="numeric" id="topM" placeholder="分" onfocus="this.select()" oninput="limitMinute(this)" onblur="padOnBlurZero(this,1)">
    </div>

    <div class="digit-guide" data-placeholder="2桁">
        <input type="number" inputmode="numeric" id="topS" placeholder="秒"
       min="0" max="59"
       onfocus="this.select()" oninput="limit(this,2)" onblur="padOnBlurZero(this,2)">
    </div>

    <div class="digit-guide" data-placeholder="3桁">
        <input type="number" inputmode="numeric" id="topMs" placeholder="ミリ"
               onfocus="this.select()" oninput="limit(this,3)" onblur="padOnBlurZero(this,3)">
    </div>
</div>

<label>TOPタイムを何％に設定？</label>
<div class="row-2">
    <div>
        <input type="number" inputmode="numeric" id="baseP_int"
               placeholder="整数"
               oninput="limit(this,3)" onblur="checkPercentMin()">
    </div>

    <div class="digit-guide" data-placeholder="2桁">
        <input type="number" inputmode="numeric" id="baseP_dec"
               placeholder="小数"
               oninput="limit(this,2)" onblur="padOnBlurZero(this,2); checkPercentMin();">
    </div>
</div>

<label>自分のタイム</label>
<div class="row-3">
    <div>
        <input type="number" inputmode="numeric" id="myM"
               placeholder="分"
               onfocus="this.select()" oninput="limitMinute(this)" onblur="padOnBlurZero(this,1)">
    </div>

    <div class="digit-guide" data-placeholder="2桁">
        <input type="number" inputmode="numeric" id="myS" placeholder="秒"
       min="0" max="59"
       onfocus="this.select()" oninput="limit(this,2)" onblur="padOnBlurZero(this,2)">
    </div>

    <div class="digit-guide" data-placeholder="3桁">
        <input type="number" inputmode="numeric" id="myMs"
               placeholder="ミリ"
               onfocus="this.select()" oninput="limit(this,3)" onblur="padOnBlurZero(this,3)">
    </div>
</div>

<button type="button" id="doneBtn" onclick="finishInput()">全て入力済</button>

<div id="result">あなたの％: ---</div>
<div id="onePercent"></div>

<table>
    <thead>
        <tr>
            <th>％基準</th>
            <th>タイム目安</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>

/* 2026.07.16 追加: 全角数字（０-９）が入力された場合、自動的に半角数字へ変換する
   （数値専用アプリのため、全角モードで打ってしまっても実害が出ないようにする） */
function toHalfWidth(str){

    return str.replace(/[０-９]/g, s=>
        String.fromCharCode(s.charCodeAt(0) - 0xFEE0)
    );
}

/* 2026.07.16 追加: マイナス入力を禁止し、入れようとした場合は "00" にリセットする
   "-"が値のどこかに含まれる場合（例: 7-333 のような不正な形も含む）はすべて対象 */
function guardNegative(el){

    if(el.value !== '' && (el.value.includes('-') || Number(el.value) < 0)){
        el.value = '00';
    }
}

/* 2026.07.16 追加: マイナス禁止ガード付きで値を保存・再計算する（分・整数欄用） */
function guardAndSave(el){

    guardNegative(el);
    saveAndCalc();
}

/* 2026.07.16 追加: ％（baseP_int + baseP_dec）が100.0未満にならないようにする
   100未満になった場合は100.0％にリセットする */
function checkPercentMin(){

    const intEl=document.getElementById('baseP_int');
    const decEl=document.getElementById('baseP_dec');

    const val=parseFloat(
        (intEl.value||0) + "." + (decEl.value||0)
    );

    if(val < 100){
        intEl.value='100';
        decEl.value='00';
        saveAndCalc();
    }
}

/* 2026.07.16 追加: 分欄は1桁縛り。2桁目以降を入力しようとした場合は
   切り詰めではなく "0" にリセットする（欄を指定したら中身の数字は0にする）
   ※ フォーカス時のクリアは各inputのonfocus="this.value=''"で対応 */
function limitMinute(el){

    el.value = toHalfWidth(el.value);
    guardNegative(el);

    if(el.value.length > 1){
        el.value = '0';
    }

    saveAndCalc();
}

function limit(el,max){

    el.value = toHalfWidth(el.value);
    guardNegative(el);

    if(el.value.length > max){
        el.value = el.value.slice(0,max);
    }

    // 秒は59まで
    if(
        (el.id === 'topS' || el.id === 'myS') &&
        Number(el.value) > 59
    ){
        el.value = 59;
    }

    // ミリ秒は999まで
    if(
        (el.id === 'topMs' || el.id === 'myMs') &&
        Number(el.value) > 999
    ){
        el.value = 999;
    }

    saveAndCalc();
}

/* 2026.07.16 追加: フォーカスが外れた時点で桁数固定の0埋め表示に確定する
   例）2桁欄に "2" だけ入力→blur → "02" と表示され、20ではなく2として
   確定したことが見た目で分かるようになる
   ※ ％欄（baseP_int / baseP_dec）専用。未入力の場合は何もしない（空のまま） */
function padOnBlur(el, length){

    if(el.value !== ''){
        el.value = el.value.padStart(length, '0');
        saveAndCalc();
    }
}

/* 2026.07.21 追加: ％欄以外（TOPタイム・自分のタイムの分/秒/ミリ秒）専用の0埋め処理。
   カーソルが離れた時点で未入力の場合は桁数分の"0"（3桁なら"000"）を自動入力する。
   値が入っている場合は従来通り桁数分のpaddingのみ行う */
function padOnBlurZero(el, length){

    if(el.value !== ''){
        el.value = el.value.padStart(length, '0');
    }else{
        el.value = '0'.padStart(length, '0');
    }

    saveAndCalc();
}

/* 2026.07.16 追加: 「入力済」ボタン用。フォーカスを外してキーボードを閉じ、
   最新の値で保存・再計算する（最後の欄にEnter移動先が無い代わりの操作） */
function finishInput(){

    if(document.activeElement && document.activeElement.tagName==='INPUT'){
        document.activeElement.blur();
    }

    saveAndCalc();
}

function saveAndCalc(){

    const ids=[
        'topM',
        'topS',
        'topMs',
        'baseP_int',
        'baseP_dec',
        'myM',
        'myS',
        'myMs'
    ];

    ids.forEach(id=>{
        localStorage.setItem(
            id,
            document.getElementById(id).value
        );
    });

    calculate();
}

/* 2026.07.17 追加: Enterキーで次の入力欄へフォーカスを移動する */
const fieldOrder=[
    'topM',
    'topS',
    'topMs',
    'baseP_int',
    'baseP_dec',
    'myM',
    'myS',
    'myMs'
];

function focusNext(currentId){

    const idx=fieldOrder.indexOf(currentId);
    const nextId=fieldOrder[idx+1];

    if(nextId){
        document.getElementById(nextId).focus();
    }else{
        document.getElementById(currentId).blur();
    }
}

fieldOrder.forEach(id=>{

    document.getElementById(id).addEventListener('keydown', e=>{

        /* 2026.07.16 追加: IME（全角モード）の変換確定Enterと区別する。
           isComposing中、またはキーコード229（IME確定時のEnter）は
           欄移動として扱わない */
        if(e.isComposing || e.keyCode === 229){
            return;
        }

        if(e.key==='Enter'){
            e.preventDefault();
            focusNext(id);
        }
    });
});

window.onload=()=>{

    fieldOrder.forEach(id=>{

        const val=localStorage.getItem(id);

        if(val){
            document.getElementById(id).value=val;
        }
    });

    calculate();
};

function calculate(){

    const topMs=

        (parseInt(document.getElementById('topM').value||0)*60000)+
        (parseInt(document.getElementById('topS').value||0)*1000)+
        parseInt(document.getElementById('topMs').value||0);

    const myMs=

        (parseInt(document.getElementById('myM').value||0)*60000)+
        (parseInt(document.getElementById('myS').value||0)*1000)+
        parseInt(document.getElementById('myMs').value||0);

    const baseP=parseFloat(
        (document.getElementById('baseP_int').value||0)
        + "."
        + (document.getElementById('baseP_dec').value||0)
    );

    const tbody=document.getElementById('tableBody');
    const onePercentEl=document.getElementById('onePercent');

    tbody.innerHTML='';

    if(topMs===0 || baseP===0){

        document.getElementById('result').innerText=
            'あなたの％: ---';

        onePercentEl.innerText='';

        return;
    }

    const virtual100Ms=
        topMs/(baseP/100);

    const onePercentSec=
        (virtual100Ms/100)/1000;

    onePercentEl.innerText=
        `1％ ＝ ${onePercentSec.toFixed(2)}秒`;

    const rates=[
        100,
        105,
        107,
        110,
        115,
        120,
        125,
        130
    ];

    rates.forEach(r=>{

        const ms=
            virtual100Ms*(r/100);

        const m=
            Math.floor(ms/60000);

        const s=
            Math.floor((ms%60000)/1000);

        const mil=
            Math.floor(ms%1000);

        tbody.innerHTML+=`
        <tr>
            <td>${r}％</td>
            <td>
                ${m}:${s.toString().padStart(2,'0')}.${mil.toString().padStart(3,'0')}
            </td>
        </tr>`;
    });

    const resultEl=document.getElementById('result');

    if(myMs>0){

        const myPercent=
            ((myMs/virtual100Ms)*100)
            .toFixed(2);

        resultEl.innerText=
            `あなたの％: ${myPercent}％`;

        /* 2026.07.30 追加: 100％未満でオレンジ背景 */
        if(myPercent < 100){
            resultEl.classList.add('under-100');
        }else{
            resultEl.classList.remove('under-100');
        }

    }else{

        resultEl.innerText=
            'あなたの％: ---';
        resultEl.classList.remove('under-100');
    }
}

</script>

</body>
</html>
